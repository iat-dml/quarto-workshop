<script>
// Step accordion for exercise pages.
//
// Mark a heading as a step in the .qmd source:
//
//   ## Step 1: Create the project {.step}
//
// Pandoc wraps each heading and its content in <section class="step">. This
// script turns every run of consecutive step sections into a group of
// <details> elements, with a button to open or close them all. The sections
// and headings stay in place, so the table of contents, its scroll tracking
// and links to #step-ids keep working. Without JavaScript the page reads as
// one long document, as before.
//
// <details> rather than a Bootstrap accordion: the browser supplies keyboard
// and screen-reader behaviour, and Ctrl+F still finds text in closed steps
// (it opens the step), which Bootstrap's hidden panels prevent.
(function () {
  "use strict";

  var allSteps = Array.prototype.slice.call(document.querySelectorAll("section.step"));
  if (allSteps.length === 0) return;

  // Group consecutive sibling step sections.
  var groups = [];
  allSteps.forEach(function (section) {
    var prev = section.previousElementSibling;
    var last = groups[groups.length - 1];
    if (last && prev === last[last.length - 1]) {
      last.push(section);
    } else {
      groups.push([section]);
    }
  });

  groups.forEach(function (sections) {
    var wrapper = document.createElement("div");
    wrapper.className = "steps";
    sections[0].parentNode.insertBefore(wrapper, sections[0]);

    var toolbar = document.createElement("div");
    toolbar.className = "steps-toolbar";
    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "steps-toggle";
    toolbar.appendChild(toggle);
    wrapper.appendChild(toolbar);

    var items = sections.map(function (section, i) {
      var heading = section.querySelector(":scope > h2, :scope > h3, :scope > h4");
      var details = document.createElement("details");
      details.className = "step-item";
      // Open the first step so the reader sees where to begin.
      if (i === 0) details.open = true;

      var summary = document.createElement("summary");
      if (heading) summary.appendChild(heading);

      var body = document.createElement("div");
      body.className = "step-body";
      while (section.firstChild) body.appendChild(section.firstChild);

      details.appendChild(summary);
      details.appendChild(body);
      section.appendChild(details);
      wrapper.appendChild(section);
      return details;
    });

    function allOpen() {
      return items.every(function (d) { return d.open; });
    }
    function updateToggle() {
      var open = allOpen();
      toggle.textContent = open ? "Collapse all steps" : "Expand all steps";
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }
    toggle.addEventListener("click", function () {
      var open = !allOpen();
      items.forEach(function (d) { d.open = open; });
      updateToggle();
    });
    items.forEach(function (d) { d.addEventListener("toggle", updateToggle); });
    updateToggle();
  });

  // Open the step that holds a link target, so in-page links and the table
  // of contents never land on hidden content.
  function openStepFor(id) {
    if (!id) return;
    var target = document.getElementById(decodeURIComponent(id));
    if (!target) return;
    var details = target.closest("details.step-item") ||
      (target.matches("section.step") ? target.querySelector(":scope > details.step-item") : null);
    if (details) details.open = true;
  }

  document.addEventListener("click", function (event) {
    var link = event.target.closest('a[href^="#"]');
    if (link) openStepFor(link.getAttribute("href").slice(1));
  }, true);
  window.addEventListener("hashchange", function () { openStepFor(location.hash.slice(1)); });
  openStepFor(location.hash.slice(1));

  // Print every step.
  window.addEventListener("beforeprint", function () {
    document.querySelectorAll("details.step-item").forEach(function (d) { d.open = true; });
  });
})();
</script>
